name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS-${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DVOLCANSTORAGE_BUILD_SAMPLES=OFF
          - arch: arm64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=arm64 -DVOLCANSTORAGE_BUILD_SAMPLES=OFF

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan & MoltenVK
        run: |
          brew install vulkan-headers
          curl -sL https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-all.tar -o /tmp/MoltenVK.tar
          tar -xf /tmp/MoltenVK.tar -C /tmp
          sudo mkdir -p /usr/local/lib
          sudo cp /tmp/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib /usr/local/lib/

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-arch }}

      - name: Build Release & Package with CPack
        run: |
          cmake --build build --config Release
          cmake --build build --config Release --target package_zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanStorage-macOS-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Update GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files

          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *"beta"* || "${{ github.ref_name }}" == *"rc"* || "${{ github.ref_name }}" == *"alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release upload "${{ github.ref_name }}" release-files/*.zip --clobber || \
          gh release create "${{ github.ref_name }}" release-files/*.zip \
            --title "VolcanStorage ${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG || echo "Release upload/creation attempted"

