name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            os-name: Windows
            arch: x64
            cmake-arch: -A x64
          - os: windows-latest
            os-name: Windows
            arch: arm64
            cmake-arch: -A ARM64
          # Linux
          - os: ubuntu-latest
            os-name: Linux
            arch: x64
            cmake-arch: ""
          # macOS (Apple Silicon & Intel)
          - os: macos-latest
            os-name: macOS
            arch: x64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-latest
            os-name: macOS
            arch: arm64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = (Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          if ($vulkanPath) {
            Write-Host "Found Vulkan SDK at: $vulkanPath"
            "VULKAN_SDK=$vulkanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$vulkanPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Vulkan SDK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libvulkan1 vulkan-headers glslang-tools libshaderc-dev

      - name: Install Vulkan & MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-headers

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DVOLCANSTORAGE_BUILD_SAMPLES=ON ${{ matrix.cmake-arch }}

      - name: Build Release & Package with CPack
        run: |
          cmake --build build --config Release
          cmake --build build --config Release --target package_zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanStorage-${{ matrix.os-name }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files

          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *"beta"* || "${{ github.ref_name }}" == *"rc"* || "${{ github.ref_name }}" == *"alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ github.ref_name }}" release-files/*.zip \
            --title "VolcanStorage ${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG || echo "Release creation attempted"
